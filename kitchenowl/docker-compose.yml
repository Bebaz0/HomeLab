services:
  kitchenowl:
    image: tombursch/kitchenowl:v0.7.10
    container_name: kitchenowl
    restart: unless-stopped
    env_file: .env
    environment:
      - FRONT_URL=https://${TS_HOST}:8449
    volumes:
      - kitchenowl_data:/data
    networks:
      - homelab
    labels:
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$$

volumes:
  kitchenowl_data:

networks:
  homelab:
    external: true
