title: arroz
description: homelab

background:
  image: /images/fundo.jpg
  blur: sm
  brightness: 45
  opacity: 55

theme: dark
color: slate
headerStyle: boxedWidgets
cardBlur: md
iconStyle: theme
target: _blank

hideVersion: true
disableCollapse: false
useEqualHeights: true
fiveColumns: false
# stats de CPU/RAM/rede por container: off, só interessam os widgets reais
showStats: false

# escreve para filtrar serviços, Enter abre o primeiro
quicklaunch:
  searchDescriptions: true
  showSearchSuggestions: true
  hideInternetSearch: false
  provider: duckduckgo

# a ordem aqui é a ordem no ecrã (cada grupo é uma coluna, ver custom.css). Grupo novo = bloco novo aqui + em services.yaml
layout:
  Infraestrutura:
    icon: mdi-server-network
  Família:
    icon: mdi-home-heart
  Produtividade:
    icon: mdi-briefcase-outline
  Serviços:
    icon: mdi-apps
  Entretenimento:
    icon: mdi-gamepad-variant-outline
